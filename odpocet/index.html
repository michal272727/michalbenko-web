  @font-face{font-family:"Cormorant";font-weight:500;font-display:swap;src:url(fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  @font-face{font-family:"Vibes";font-weight:400;font-display:swap;src:url(fonts/great-vibes-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

  :root{
    --ivory:#0c241e; --ivory-2:#123a30; --card:rgba(255,255,255,.055);
    --ink:#f6f1e7; --ink-2:#b7cbbf; --blush:#e7b7b0; --blush-2:#1d4a3d;
    --gold-1:#d4ad66; --gold-2:#ecd39d; --gold-3:#fff3d6; --line:rgba(236,211,157,.26);
    --serif:"Cormorant","Cormorant Garamond",Didot,"Bodoni 72",Georgia,serif;
    --script:"Vibes","Snell Roundhand","Apple Chancery",cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--serif);color:var(--ink);min-height:100vh;overflow-x:hidden;
    background:
      radial-gradient(1100px 620px at 50% -12%, #1f5444 0%, transparent 62%),
      radial-gradient(700px 500px at 0% 100%, var(--blush-2) 0%, transparent 70%),
      radial-gradient(700px 500px at 100% 95%, #0a1c17 0%, transparent 70%),
      var(--ivory);
    -webkit-font-smoothing:antialiased;
  }
  #petals{position:fixed;inset:0;pointer-events:none;z-index:0}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

  .page{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 16px 40px}

  /* ---- ozdobné rohy ---- */
  .corner{position:fixed;width:min(34vw,260px);opacity:.7;z-index:0;pointer-events:none}
  .corner.tl{top:-8px;left:-8px}
  .corner.br{bottom:-8px;right:-8px;transform:rotate(180deg)}

  /* ---- hlavička ---- */
  header{text-align:center;padding-top:clamp(12px,4vh,40px)}
  .rings{width:68px;height:auto;display:block;margin:0 auto 10px;animation:float 5s ease-in-out infinite}
  .date{letter-spacing:.42em;font-size:clamp(13px,2.2vw,16px);color:var(--gold-1);font-weight:600;padding-left:.42em;font-variant-numeric:lining-nums}
  h1{font-family:var(--script);font-weight:400;font-size:clamp(48px,10vw,96px);line-height:1.05;margin:6px 0 0;color:var(--ink)}
  .divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px auto 0;max-width:420px;color:var(--gold-1)}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-2),transparent)}

  /* ---- hero počet dní ---- */
  .hero{text-align:center;margin:clamp(22px,5vh,48px) auto 0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .hero .pre{font-size:clamp(18px,3vw,24px);color:var(--ink-2);font-style:italic}
  .big{
    font-family:var(--serif);font-weight:600;line-height:.9;letter-spacing:-.02em;
    font-size:clamp(130px,30vw,300px);font-variant-numeric:lining-nums tabular-nums;
    background:linear-gradient(100deg,var(--gold-1) 0%,var(--gold-2) 28%,var(--gold-3) 42%,var(--gold-2) 56%,var(--gold-1) 80%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 7s linear infinite;
    filter:drop-shadow(0 8px 26px rgba(0,0,0,.45));
    display:inline-block;
  }
  .big.pop{animation:shimmer 7s linear infinite, pop .9s cubic-bezier(.2,.9,.3,1.4)}
  .unit-big{font-family:var(--script);font-size:clamp(34px,6vw,54px);color:var(--ink);margin-top:-4px}
  .hint{margin-top:8px;font-size:14px;color:var(--ink-2);opacity:.75;letter-spacing:.06em}

  /* ---- živé hodiny ---- */
  .clock{display:flex;justify-content:center;align-items:flex-start;gap:clamp(8px,2vw,18px);margin:22px auto 0}
  .clock .seg{text-align:center;min-width:clamp(60px,14vw,92px)}
  .clock .v{font-size:clamp(34px,7vw,52px);font-weight:600;font-variant-numeric:lining-nums tabular-nums;line-height:1;color:var(--ink);display:inline-block}
  .clock .v.tick{animation:tick .45s ease-out}
  .clock .l{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
  .clock .colon{font-size:clamp(30px,6vw,46px);color:var(--gold-2);line-height:1;animation:blink 1s steps(1) infinite}

  /* ---- mesiace / týždne / dni ---- */
  .breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,18px);max-width:720px;margin:clamp(30px,6vh,54px) auto 0}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 8px 18px;text-align:center;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 22px 44px -26px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
    position:relative;overflow:hidden;transition:transform .3s ease, box-shadow .3s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 30px 54px -26px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.1)}
  .card::after{content:"";position:absolute;inset:6px;border:1px solid rgba(236,211,157,.16);border-radius:16px;pointer-events:none}
  .card .n{font-size:clamp(46px,9vw,74px);font-weight:600;line-height:1;color:var(--gold-1);font-variant-numeric:lining-nums tabular-nums}
  .card .t{font-size:clamp(17px,2.6vw,21px);color:var(--ink-2);margin-top:6px;font-style:italic}

  /* ---- progress ---- */
  .progress{max-width:560px;margin:34px auto 0;text-align:center}
  .track{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
  .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blush),var(--gold-2),var(--gold-1));transition:width 1.2s ease;position:relative}
  .fill::after{content:"♥";position:absolute;right:-2px;top:50%;transform:translate(50%,-50%);font-size:18px;color:#f0a9a0;line-height:1}
  .progress p{margin-top:12px;font-size:17px;color:var(--ink-2)}
  .progress strong{color:var(--gold-1)}

  /* ---- fakt dňa ---- */
  .fact{
    max-width:720px;margin:clamp(34px,6vh,56px) auto 0;text-align:center;padding:28px 22px 26px;
    border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(231,183,176,.06));
    border:1px solid var(--line);position:relative;
  }
  .fact .tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--ivory);padding:2px 16px;border:1px solid var(--line);border-radius:99px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-1);white-space:nowrap}
  .fact .txt{font-size:clamp(21px,3.4vw,28px);line-height:1.35;font-style:italic}
  .fact .txt b{font-style:normal;color:var(--gold-1);font-variant-numeric:lining-nums}
  .fact .txt{transition:opacity .25s ease, transform .25s ease}
  .fact .txt.out{opacity:0;transform:translateY(6px)}
  .fact-nav{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px}
  .fact-nav button{font-family:var(--serif);font-size:17px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:99px;padding:7px 18px;cursor:pointer;transition:background .2s, transform .15s;-webkit-tap-highlight-color:transparent}
  .fact-nav button:hover{background:rgba(236,211,157,.16)}
  .fact-nav button:active{transform:scale(.95)}
  .fact-nav .arr{width:40px;height:40px;padding:0;font-size:20px;line-height:1}
  .fact-nav .cnt{font-size:14px;color:var(--ink-2);min-width:46px;font-variant-numeric:lining-nums tabular-nums}


  .done{display:none;text-align:center;margin-top:40px}
  .done .big{font-size:clamp(70px,16vw,160px)}

  footer{text-align:center;margin-top:56px;font-size:14px;color:var(--ink-2);opacity:.8}
  footer a{color:inherit}

  @keyframes shimmer{to{background-position:-250% 0}}
  @keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes tick{0%{transform:translateY(-35%);opacity:.2}100%{transform:none;opacity:1}}
  @keyframes blink{50%{opacity:.25}}
  @keyframes float{50%{transform:translateY(-6px)}}

  @media (max-width:520px){
    .breakdown{gap:8px}
    .card{border-radius:16px;padding:18px 4px 14px}
    .card::after{inset:4px;border-radius:12px}
    .clock .l{font-size:11px;letter-spacing:.12em}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>

<div class="page">
  <header>
    <svg class="rings" viewBox="0 0 120 80" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#c79a4f"/><stop offset=".5" stop-color="#fff3d6"/><stop offset="1" stop-color="#c79a4f"/></linearGradient></defs>

  <section id="live">

<script>
(function(){
  "use strict";
  /* ===== NASTAVENIA ===== */
  var TARGET = {y:2027, mo:6, d:12, h:0, mi:0};   // 12. 6. 2027 00:00 (slovenský čas)
  var START  = {y:2026, mo:10, d:23, h:0, mi:0};  // od kedy sa ráta progress
  var TZ = "Europe/Bratislava";

  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function(id){ return document.getElementById(id); };
  var DAY = 864e5;

  /* "nástenný" čas na Slovensku ako pseudo-UTC timestamp (správne aj pri zmene času) */
  var fmt = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
  function nowSK(){
    var o={}; fmt.formatToParts(new Date()).forEach(function(p){o[p.type]=p.value;});
    return Date.UTC(+o.year, +o.month-1, +o.day, +o.hour, +o.minute, +o.second);
  }
  function ts(o){ return Date.UTC(o.y, o.mo-1, o.d, o.h||0, o.mi||0, 0); }
  var T = ts(TARGET), S = ts(START);

  function addMonths(t, n){
    var x = new Date(t), y = x.getUTCFullYear(), m = x.getUTCMonth()+n, d = x.getUTCDate();
    var last = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
    return Date.UTC(y, m, Math.min(d,last), x.getUTCHours(), x.getUTCMinutes(), x.getUTCSeconds());
  }
  function pl(n, a, b, c){ n=Math.abs(n); return n===1?a:(n>=2&&n<=4?b:c); }
  function nf(n, dec){ return n.toLocaleString("sk-SK",{maximumFractionDigits:dec||0, minimumFractionDigits:dec||0}); }
  function pad(n){ return (n<10?"0":"")+n; }
  function startOfDay(t){ return t - (t % DAY); }

  function countWeekday(fromT, toT, wd){ // počet daného dňa v týždni od zajtra po deň pred cieľom
    var c=0; for(var t=startOfDay(fromT)+DAY; t<startOfDay(toT); t+=DAY){ if(new Date(t).getUTCDay()===wd) c++; }
    return c;
  }
  function fullMoons(fromReal, toReal){ // približne, synodický mesiac
    var syn=29.530588853*DAY, ref=Date.UTC(2000,0,6,18,14)+syn/2, c=0;
    var k=Math.ceil((fromReal-ref)/syn); for(var t=ref+k*syn; t<toReal; t+=syn) c++;
    return c;
  }

  /* ===== výpočet ===== */
  function calc(){
    var now = nowSK(), diff = T - now;
    if (diff <= 0) return null;
    var days = Math.floor(diff/DAY), rem = diff - days*DAY;
    var months = 0; while (addMonths(now, months+1) <= T) months++;
    var restDays = Math.floor((T - addMonths(now, months))/DAY);
    var calDays = Math.round((T - startOfDay(now))/DAY); // počet "polnocí" do cieľa
    return {
      now:now, diff:diff, days:days, calDays:calDays,
      h:Math.floor(rem/36e5), mi:Math.floor(rem%36e5/6e4), s:Math.floor(rem%6e4/1e3),
      months:months, weeks:Math.floor(restDays/7), wdays:restDays%7,
      sat:countWeekday(now,T,6), mon:countWeekday(now,T,1), fri:countWeekday(now,T,5), sun:countWeekday(now,T,0),
      moons:fullMoons(Date.now(), Date.now()+diff),
      sec:diff/1e3,
      pct:Math.max(0,Math.min(100,(now-S)/(T-S)*100))
    };
  }

  /* ===== fakt dňa – mení sa každý deň ===== */
  var FACTS = [
    function(c){return "Do veľkého dňa stihneš ešte <b>"+nf(c.calDays*2)+"</b> káv. Odporúčame neprekračovať.";},
    function(c){return "Ostáva <b>"+nf(c.mon)+"</b> "+pl(c.mon,"pondelok","pondelky","pondelkov")+". Každý ďalší je o kúsok znesiteľnejší.";},
    function(c){return "Zem musí preletieť ešte <b>"+nf(c.sec/3600*107226)+" km</b>. Usilovne na tom pracuje.";},
    function(c){return "Mesiac bude v splne ešte <b>"+c.moons+"×</b>. Vlkolaci sú pozvaní len na after-party.";},
    function(c){return "<b>"+nf(c.days)+"</b> dní = <b>"+nf(c.days*24)+"</b> hodín. Dosť času naučiť sa prvý tanec. Asi.";},
    function(c){return "Ešte <b>"+nf(c.fri)+"</b> "+pl(c.fri,"piatok","piatky","piatkov")+". To je "+nf(c.fri)+" pízz, ak sa nič nepokazí.";},
    function(c){return "Vlasy narastú ešte o <b>"+nf(c.calDays*0.035,1)+" cm</b>. Kaderník už vie, čo s nimi.";},
    function(c){return "Ostáva <b>"+nf(c.calDays)+"</b> "+pl(c.calDays,"noc","noci","nocí")+". Tú poslednú aj tak nikto nezaspí.";},
    function(c){return "Srdce udrie ešte <b>"+nf(c.sec*72/60)+"×</b>. Na ten deň si odlož aspoň jeden úder navyše.";},
    function(c){return "Ešte <b>"+nf(c.sun)+"</b> "+pl(c.sun,"nedeľný obed","nedeľné obedy","nedeľných obedov")+" u rodičov. Tréning na svadobné menu.";},
    function(c){return "Keby si každý deň odložil 1 €, na svadbe máš <b>"+nf(c.calDays)+" €</b>. Na dobré víno to stačí.";},
    function(c){return "Čakania máme za sebou <b>"+nf(c.pct,1)+" %</b>. Zvyšok je už len formalita.";},
    function(c){return "Ostáva <b>"+nf(c.sat)+"</b> "+pl(c.sat,"víkend","víkendy","víkendov")+" na plánovanie. Rozhodne aj tak nevesta.";},
    function(c){return "Ešte <b>"+nf(c.sec*15/60)+"</b> nádychov. Ten najdôležitejší príde tesne pred „áno“.";},
    function(c){return "Nechty narastú o <b>"+nf(c.calDays*0.1,1)+" mm</b>. Manikúra má o prácu postarané.";},
    function(c){return "Za <b>"+nf(c.days)+"</b> dní sa dá „áno“ nacvičiť <b>"+nf(c.days)+"×</b>. Pripravenosť: 100 %.";},
    function(c){return "Ostáva <b>"+nf(c.months)+"</b> "+pl(c.months,"mesiac","mesiace","mesiacov")+" a "+nf(c.weeks)+" "+pl(c.weeks,"týždeň","týždne","týždňov")+". Torta bude čokoládová. (Ešte sa uvidí.)";},
    function(c){return "Ešte <b>"+nf(c.sec)+"</b> sekúnd. Hovorí sa, že trpezlivosť ruže prináša.";},
    function(c){return "Do svadby zje priemerný Slovák ešte asi <b>"+nf(c.calDays*0.3)+"</b> rožkov. Do šiat sa to zmestí.";},
    function(c){return "<b>"+nf(c.calDays)+"</b> rán, keď sa dá povedať „už len "+nf(c.calDays)+" dní“. Dnes je jedno z nich.";}
  ];
  var dayIdx = 0, off = 0;
  function renderFact(c){ var n=FACTS.length, i=((dayIdx+off)%n+n)%n; $("fact").innerHTML = FACTS[i](c); }
  function switchFact(step, ev){
    var c=calc(); if(!c) return;
    if (step===0){ var r; do { r=Math.floor(Math.random()*FACTS.length); } while (FACTS.length>1 && r===((dayIdx+off)%FACTS.length+FACTS.length)%FACTS.length); off=r-dayIdx; }
    else off+=step;
    var el=$("fact");
    if (reduce){ renderFact(c); }
    else { el.classList.add("out"); setTimeout(function(){ renderFact(c); el.classList.remove("out"); }, 220); }
    if (ev && typeof burst==="function"){ var b=ev.currentTarget.getBoundingClientRect(); burst(b.left+b.width/2, b.top+b.height/2, 30); }
  }
  $("prevFact").addEventListener("click", function(e){ switchFact(-1,e); });
  $("nextFact").addEventListener("click", function(e){ switchFact(1,e); });
  $("rndFact").addEventListener("click", function(e){ switchFact(0,e); });

  /* ===== render ===== */
  var last = {};
  function setTxt(id, v, cls){
    if (last[id] === v) return; last[id] = v;
    var el=$(id); el.textContent=v;
    if (cls && !reduce){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  }
  function render(){
    var c = calc();
    if (!c){ $("live").style.display="none"; $("done").style.display="block"; if(!render.fin){ render.fin=1; party(); } return; }
    setTxt("bigDays", nf(c.days), "pop");
    setTxt("bigUnit", pl(c.days,"deň","dni","dní"));
    setTxt("hh", pad(c.h), "tick"); setTxt("mm", pad(c.mi), "tick"); setTxt("ss", pad(c.s), "tick");
    setTxt("m", String(c.months)); setTxt("ml", pl(c.months,"mesiac","mesiace","mesiacov"));
    setTxt("w", String(c.weeks));  setTxt("wl", pl(c.weeks,"týždeň","týždne","týždňov"));
    setTxt("d", String(c.wdays));  setTxt("dl", pl(c.wdays,"deň","dni","dní"));
    $("fill").style.width = c.pct.toFixed(2)+"%"; setTxt("pct", nf(c.pct,1)+" %");
    var di = Math.floor(c.now/DAY); if (di !== render.day){ render.day = di; dayIdx = di % FACTS.length; renderFact(c); }
  }
  render();
  setInterval(render, 1000);

  /* ===== padajúce lupene ===== */
  var pc=$("petals"), px=pc.getContext("2d"), petals=[], W, H, DPR=Math.min(devicePixelRatio||1,2);
  function size(){ W=innerWidth; H=innerHeight; [pc,$("confetti")].forEach(function(cv){cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px";}); px.setTransform(DPR,0,0,DPR,0,0); cx.setTransform(DPR,0,0,DPR,0,0); }
  var cc=$("confetti"), cx=cc.getContext("2d");
  addEventListener("resize", size); size();
  var PCOL=["#ffffff","#f6dcd6","#e7b7b0","#fff3d6","#f9ece8"];
  function newPetal(top){ return {x:Math.random()*W, y:top?Math.random()*H:-20, r:6+Math.random()*7, vy:.35+Math.random()*.6, vx:-.3+Math.random()*.6, a:Math.random()*6.28, va:-.02+Math.random()*.04, sw:Math.random()*6.28, col:PCOL[Math.random()*PCOL.length|0], o:.55+Math.random()*.4}; }
  var NP = W<600?14:26; for(var i=0;i<NP;i++) petals.push(newPetal(true));
  function drawPetal(p){
    px.save(); px.translate(p.x,p.y); px.rotate(p.a); px.globalAlpha=p.o; px.fillStyle=p.col;
    px.beginPath(); px.moveTo(0,-p.r); px.bezierCurveTo(p.r*.9,-p.r*.6,p.r*.7,p.r*.6,0,p.r); px.bezierCurveTo(-p.r*.7,p.r*.6,-p.r*.9,-p.r*.6,0,-p.r); px.fill();
    px.globalAlpha=p.o*.5; px.strokeStyle="#c98e86"; px.lineWidth=.6; px.beginPath(); px.moveTo(0,-p.r*.7); px.lineTo(0,p.r*.7); px.stroke(); px.restore();
  }

  /* ===== konfety ===== */
  var bits=[], CCOL=["#ecd39d","#d4ad66","#fff3d6","#e7b7b0","#ffffff","#9fd0b8"];
  function burst(x,y,n){
    if (reduce) return;
    for(var i=0;i<n;i++){ var a=Math.random()*6.28, sp=3+Math.random()*7;
      bits.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,g:.18+Math.random()*.1,w:5+Math.random()*6,h:3+Math.random()*4,rot:Math.random()*6.28,vr:-.2+Math.random()*.4,col:CCOL[Math.random()*CCOL.length|0],life:110+Math.random()*60,heart:Math.random()<.18}); }
  }
  function party(){ var k=0, t=setInterval(function(){ burst(Math.random()*W, H*.3, 50); if(++k>12) clearInterval(t); }, 350); }
  $("hero").addEventListener("click", function(e){ burst(e.clientX, e.clientY, 90); });

  function frame(){
    px.clearRect(0,0,W,H);
    petals.forEach(function(p,i){ p.sw+=.02; p.x+=p.vx+Math.sin(p.sw)*.4; p.y+=p.vy; p.a+=p.va; if(p.y>H+20||p.x<-30||p.x>W+30) petals[i]=newPetal(false); drawPetal(p); });
    cx.clearRect(0,0,W,H);
    for(var i=bits.length-1;i>=0;i--){ var b=bits[i]; b.vx*=.985; b.vy+=b.g; b.x+=b.vx; b.y+=b.vy; b.rot+=b.vr; b.life--;
      if(b.life<=0||b.y>H+30){ bits.splice(i,1); continue; }
      cx.save(); cx.translate(b.x,b.y); cx.rotate(b.rot); cx.globalAlpha=Math.min(1,b.life/40); cx.fillStyle=b.col;
      if(b.heart){ cx.font="14px serif"; cx.fillText("♥",-5,5); } else cx.fillRect(-b.w/2,-b.h/2,b.w,b.h*Math.abs(Math.cos(b.rot*2)));
      cx.restore(); }
    requestAnimationFrame(frame);
  }
  if (!reduce) requestAnimationFrame(frame); else petals.forEach(drawPetal);

  // privítacie konfety
  setTimeout(function(){ var r=$("bigDays").getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 70); }, 700);
})();
</script>
</body>
</html>
